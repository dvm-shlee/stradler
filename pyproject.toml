[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stradler"
version = "0.1.0a1"
description = "Strata handler: layered data-structure and workflow framework (alpha skeleton)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "dvm-shlee" }]
requires-python = ">=3.11"
classifiers = ["Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License"]

[project.scripts]
stradler = "stradler.cli:main"
stradler-slurm = "stradler.ext.slurm:main"
# stradler-apptainer: Apptainer container runtime add-on (docs/addons/apptainer.md)
stradler-apptainer = "stradler.ext.apptainer:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/stradler"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "stradler/schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
